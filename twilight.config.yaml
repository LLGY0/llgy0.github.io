        #      # 导航链接
        #      url: "/exhibition/"
        #      # 导航图标
        #      icon: "material-symbols:person"
        #      # 导航描述
        #      description: "细数自己的罪恶"
        #      # 子链接
        #      children:
        #          - # 二级导航链接 - 项目 
        #              "Projects"
        #          - # 相册
        #              "Albums"
        #          - # 动画 
        #              "Anime"
        #          - # 一级导航链接 - 归档 (预设)
        #              "Archive"
